[project]
name = "tracecost"
version = "0.1.0"
description = "Recompute what your LLM traces cost, offline, from OTLP, Langfuse or Phoenix exports, with cache and reasoning tokens priced, and see where your observability tool's totals disagree."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thanatchon" }]
keywords = ["opentelemetry", "otlp", "llm", "cost", "tokens", "langfuse", "phoenix", "openinference", "observability", "genai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/thanatchon36/tracecost"
Issues = "https://github.com/thanatchon36/tracecost/issues"
Changelog = "https://github.com/thanatchon36/tracecost/blob/main/CHANGELOG.md"

[project.scripts]
tracecost = "tracecost.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["tracecost"]
branch = true

[tool.coverage.report]
show_missing = true
